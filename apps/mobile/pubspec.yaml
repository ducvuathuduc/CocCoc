name: cocenglish
description: "Flutter language learning interface"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  appwrite: 27.0.0
  flutter:
    sdk: flutter
  flutter_riverpod: 3.4.3
  go_router: 18.0.2
  lottie: 3.6.1
  qr_flutter: 4.1.0
  rive: 0.14.11
  shared_preferences: 2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    # Original illustration ROIs for English journeys, Stories, Max and Timer Boost.
    - assets/reference_art/
    - assets/reference_art/course-remove.png
    - assets/motion/
  fonts:
    - family: DuolingoSans
      fonts:
        - asset: assets/fonts/DuolingoSans.ttf
          weight: 400
        - asset: assets/fonts/DuolingoSans-Bold.ttf
          weight: 700
    - family: Feather
      fonts:
        - asset: assets/fonts/Feather.ttf
          weight: 700
