name: cocenglish
description: "Flutter language learning interface"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  appwrite: 27.0.0
  audioplayers: 6.5.1
  crypto: 3.0.7
  cupertino_icons: 1.0.9
  drift: 2.35.1
  drift_flutter: 0.3.1
  flutter:
    sdk: flutter
  flutter_riverpod: 3.4.3
  flutter_local_notifications: 22.3.2
  flutter_svg: 2.3.0
  flutter_timezone: 5.1.1
  go_router: 18.0.2
  home_widget: 0.10.0
  lottie: 3.6.1
  path_provider: 2.1.6
  qr_flutter: 4.1.0
  record: 7.1.2
  rive: 0.14.11
  shared_preferences: 2.5.5
  timezone: 0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  patrol: 4.10.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/cocenglish-mark.svg
    - assets/brand/cocenglish-mascot-wave.png
    - assets/brand/cocenglish-mascot-study.png
    - assets/brand/cocenglish-mascot-celebrate.png
    - assets/lesson_images/
    - assets/lesson_audio/
    - assets/sfx/
    - assets/avatar/avatar_builder_config.json

# On-device E2E (patrol_test/), run in CI by .github/workflows/android-e2e.yml.
patrol:
  app_name: CocEnglish
  test_directory: patrol_test
  screenshot_on_failure: true
  android:
    package_name: com.cocenglish.cocenglish
