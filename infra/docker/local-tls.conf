events {}
http {
  access_log off;
  server_tokens off;
  ssl_certificate /local-tls/server.crt;
  ssl_certificate_key /local-tls/server.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  client_max_body_size 64m;
  resolver 127.0.0.11 valid=10s;
  server {
    listen 8443 ssl;
    location / {
      set $upstream appwrite:80;
      proxy_pass http://$upstream;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $remote_addr;
    }
  }
  server {
    listen 4101 ssl;
    location / { set $upstream learning:8080; proxy_pass http://$upstream; }
  }
  server {
    listen 4102 ssl;
    location / { set $upstream progress:8080; proxy_pass http://$upstream; }
  }
  server {
    listen 4103 ssl;
    location / { set $upstream ai:8080; proxy_pass http://$upstream; }
  }
}
