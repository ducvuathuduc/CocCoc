# Include at server level for each HTTPS API virtual host.
ssl_protocols TLSv1.2 TLSv1.3;
client_max_body_size 1m;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header Connection "";
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_pass_request_headers on;
proxy_connect_timeout 5s;
proxy_send_timeout 180s;
proxy_read_timeout 180s;
proxy_intercept_errors off;
proxy_next_upstream off;
proxy_cache off;
access_log /var/log/nginx/cocenglish-dotnet-access.log cocenglish_dotnet;
# Detailed Nginx errors can include raw request URLs. Review host-wide logging too.
error_log /var/log/nginx/cocenglish-dotnet-error.log crit;
