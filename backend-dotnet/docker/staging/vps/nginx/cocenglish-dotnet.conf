        proxy_pass http://127.0.0.1:5102;
    }
    location / { proxy_pass http://127.0.0.1:5102; }
}

server {
    listen 443 ssl;
    server_name ai-staging.example.invalid;
    ssl_certificate /etc/letsencrypt/live/ai-staging.example.invalid/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai-staging.example.invalid/privkey.pem;
    include /etc/nginx/snippets/cocenglish-dotnet-proxy.conf;

    location = /ready {
        include /etc/nginx/snippets/cocenglish-dotnet-internal-access.conf;
        proxy_pass http://127.0.0.1:5103;
    }
    location ^~ /internal/ {
        include /etc/nginx/snippets/cocenglish-dotnet-internal-access.conf;
        proxy_pass http://127.0.0.1:5103;
    }
    location / { proxy_pass http://127.0.0.1:5103; }
}
