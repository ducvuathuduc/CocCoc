# Install in Nginx's http context (for example conf.d), after replacing domains
# and certificate paths. Prepared only; not installed or syntax-checked.
log_format cocenglish_dotnet escape=json
  '{"time":"$time_iso8601","host":"$server_name","status":$status,'
  '"duration":$request_time,"upstream_status":"$upstream_status",'
  '"upstream_duration":"$upstream_response_time","request_id":"$sent_http_x_request_id"}';

server {
    listen 80;
    server_name learning-staging.example.invalid;
    access_log /var/log/nginx/cocenglish-dotnet-access.log cocenglish_dotnet;
    return 308 https://learning-staging.example.invalid$request_uri;
}
server {
    listen 80;
    server_name progress-staging.example.invalid;
    access_log /var/log/nginx/cocenglish-dotnet-access.log cocenglish_dotnet;
    return 308 https://progress-staging.example.invalid$request_uri;
}
server {
    listen 80;
    server_name ai-staging.example.invalid;
    access_log /var/log/nginx/cocenglish-dotnet-access.log cocenglish_dotnet;
    return 308 https://ai-staging.example.invalid$request_uri;
}

server {
    listen 443 ssl;
    server_name learning-staging.example.invalid;
    ssl_certificate /etc/letsencrypt/live/learning-staging.example.invalid/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/learning-staging.example.invalid/privkey.pem;
    include /etc/nginx/snippets/cocenglish-dotnet-proxy.conf;

    location = /ready {
        include /etc/nginx/snippets/cocenglish-dotnet-internal-access.conf;
        proxy_pass http://127.0.0.1:5101;
    }
    location ^~ /internal/ {
        include /etc/nginx/snippets/cocenglish-dotnet-internal-access.conf;
        proxy_pass http://127.0.0.1:5101;
    }
    location / { proxy_pass http://127.0.0.1:5101; }
}

server {
    listen 443 ssl;
    server_name progress-staging.example.invalid;
    ssl_certificate /etc/letsencrypt/live/progress-staging.example.invalid/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/progress-staging.example.invalid/privkey.pem;
