name: cocenglish-dotnet-staging

x-host: &host
  platform: linux/amd64
  init: true
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: ['/tmp:rw,noexec,nosuid,size=64m']
  mem_limit: 512m
  pids_limit: 128
  stop_grace_period: 45s
  environment:
    ASPNETCORE_ENVIRONMENT: Staging
    ASPNETCORE_URLS: http://+:8080
  deploy:
    replicas: 1
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: '3'
  healthcheck:
    test: [CMD, /app/entrypoint, --probe]
    interval: 15s
    timeout: 5s
    retries: 5
    start_period: 20s

services:
  progress:
    <<: *host
    image: ${COC_PROGRESS_IMAGE:?Set the reviewed Progress image digest}
    env_file:
      - ${COC_STAGING_SECRETS_DIR:?Set an absolute private configuration directory}/common.env
      - ${COC_STAGING_SECRETS_DIR}/progress.env
    ports: ['127.0.0.1:5102:8080']
  learning:
    <<: *host
    image: ${COC_LEARNING_IMAGE:?Set the reviewed Learning image digest}
    env_file:
      - ${COC_STAGING_SECRETS_DIR}/common.env
      - ${COC_STAGING_SECRETS_DIR}/learning.env
    ports: ['127.0.0.1:5101:8080']
  ai:
    <<: *host
    image: ${COC_AI_IMAGE:?Set the reviewed AI image digest}
    env_file:
      - ${COC_STAGING_SECRETS_DIR}/common.env
      - ${COC_STAGING_SECRETS_DIR}/ai.env
    ports: ['127.0.0.1:5103:8080']
