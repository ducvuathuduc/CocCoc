# Optional overlay for compose.staging.yaml. Mount only each service's own secrets.
services:
  progress:
    secrets:
      - source: progress_appwrite_key
        target: COC_PROGRESS_APPWRITE_KEY
      - source: progress_service_keys
        target: COC_SERVICE_KEYS
      - source: progress_code_secret
        target: COC_PROGRESS_CODE_SECRET
  learning:
    secrets:
      - source: learning_appwrite_key
        target: COC_LEARNING_APPWRITE_KEY
      - source: learning_service_keys
        target: COC_SERVICE_KEYS
  ai:
    secrets:
      - source: ai_appwrite_key
        target: COC_AI_APPWRITE_KEY
      - source: ai_service_keys
        target: COC_SERVICE_KEYS

secrets:
  progress_appwrite_key:
    file: ${COC_STAGING_SECRETS_DIR:?Set an absolute private configuration directory}/progress/COC_PROGRESS_APPWRITE_KEY
  progress_service_keys:
    file: ${COC_STAGING_SECRETS_DIR}/progress/COC_SERVICE_KEYS
  progress_code_secret:
    file: ${COC_STAGING_SECRETS_DIR}/progress/COC_PROGRESS_CODE_SECRET
  learning_appwrite_key:
    file: ${COC_STAGING_SECRETS_DIR}/learning/COC_LEARNING_APPWRITE_KEY
  learning_service_keys:
    file: ${COC_STAGING_SECRETS_DIR}/learning/COC_SERVICE_KEYS
  ai_appwrite_key:
    file: ${COC_STAGING_SECRETS_DIR}/ai/COC_AI_APPWRITE_KEY
  ai_service_keys:
    file: ${COC_STAGING_SECRETS_DIR}/ai/COC_SERVICE_KEYS
