# Optional only after speech has passed device, quality, privacy and cost acceptance.
# Combine with compose.staging.yaml and compose.staging.secrets.yaml.
services:
  ai:
    secrets:
      - source: ai_azure_speech_key
        target: COC_AZURE_SPEECH_KEY
      - source: ai_assemblyai_api_key
        target: COC_ASSEMBLYAI_API_KEY
      - source: ai_deepgram_api_key
        target: COC_DEEPGRAM_API_KEY

secrets:
  ai_azure_speech_key:
    file: ${COC_STAGING_SECRETS_DIR:?Set an absolute private configuration directory}/ai/COC_AZURE_SPEECH_KEY
  ai_assemblyai_api_key:
    file: ${COC_STAGING_SECRETS_DIR}/ai/COC_ASSEMBLYAI_API_KEY
  ai_deepgram_api_key:
    file: ${COC_STAGING_SECRETS_DIR}/ai/COC_DEEPGRAM_API_KEY
