services:
  progress:
    secrets:
      - source: progress_otel_metrics_headers
        target: COC_OTEL_METRICS_HEADERS
  learning:
    secrets:
      - source: learning_otel_metrics_headers
        target: COC_OTEL_METRICS_HEADERS
  ai:
    secrets:
      - source: ai_otel_metrics_headers
        target: COC_OTEL_METRICS_HEADERS

secrets:
  progress_otel_metrics_headers:
    file: ${COC_STAGING_SECRETS_DIR:?Set an absolute private configuration directory}/progress/COC_OTEL_METRICS_HEADERS
  learning_otel_metrics_headers:
    file: ${COC_STAGING_SECRETS_DIR}/learning/COC_OTEL_METRICS_HEADERS
  ai_otel_metrics_headers:
    file: ${COC_STAGING_SECRETS_DIR}/ai/COC_OTEL_METRICS_HEADERS
