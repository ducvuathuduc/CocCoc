# [VI] CI backend: chạy khi PR/push main có thay đổi service, schema, contract, docs API/data
# hoặc hạ tầng. Các bước chính: cài pnpm theo lockfile → TypeScript/ESLint/Prettier/test →
# smoke nội bộ → smoke HTTP thật cho 3 service → contract/OpenAPI lint.
# Artifact đầu ra là 3 bundle Function độc lập; workflow không deploy và không dùng secret cloud.
name: Backend foundation
on:
  pull_request:
    paths:
      - services/**
      - packages/**
      - appwrite/**
      - content/**
      - tools/audit/**
      - tools/blueprint/**
      - tools/evals/**
      - tools/postman/**
      - tools/toolchain.json
      - tools/scripts/backend*.mjs
      - tools/scripts/dev-*.mjs
      - tools/scripts/local-*.mjs
      - tools/scripts/local-*.sh
      - tools/tests/local-*.test.mjs
      - tools/tests/dart-contract-line-endings.test.mjs
      - tools/tests/backend-workflow-paths.test.mjs
      - infra/docker/**
      - docs/api/**
      - docs/data/**
      - .gitattributes
      - package.json
      - pnpm-workspace.yaml
      - pnpm-lock.yaml
      - tsconfig.backend.json
      - eslint.config.mjs
      - .github/workflows/*.yml
  push:
    paths:
      - services/**
      - packages/**
      - appwrite/**
      - content/**
      - tools/audit/**
      - tools/blueprint/**
      - tools/evals/**
      - tools/postman/**
      - tools/toolchain.json
      - tools/scripts/backend*.mjs
      - tools/scripts/dev-*.mjs
      - tools/scripts/local-*.mjs
      - tools/scripts/local-*.sh
      - tools/tests/local-*.test.mjs
      - tools/tests/dart-contract-line-endings.test.mjs
      - tools/tests/backend-workflow-paths.test.mjs
      - infra/docker/**
      - docs/api/**
      - docs/data/**
      - .gitattributes
      - package.json
      - pnpm-workspace.yaml
      - pnpm-lock.yaml
      - tsconfig.backend.json
      - eslint.config.mjs
      - .github/workflows/*.yml
    branches:
      - main
  workflow_dispatch:
    inputs:
      extended_checks:
        description: Run documentation, schema, Postman, local tooling and load checks
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  deterministic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.3
      - run: npm install --global pnpm@10.15.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm backend:verify
      - run: pnpm backend:smoke
      - run: pnpm dev:smoke
      - run: pnpm contracts:check
      - run: node --test tools/tests/dart-contract-line-endings.test.mjs
      - run: node --test tools/tests/backend-workflow-paths.test.mjs
      - run: pnpm api:lint
      - name: Extended checks (manual)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.extended_checks }}
        run: |-
          pnpm local:test
          node tools/scripts/local-load.mjs --requests=100 --concurrency=10
          pnpm postman:check
          pnpm postman:test
          pnpm postman:run:local
          pnpm schema:plan
          pnpm schema:test
          pnpm seed:check
          pnpm blueprint:check
          pnpm audit:check
          node tools/evals/voice-harness.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: independent-function-scaffolds
          path: services/*/dist/function.mjs
          if-no-files-found: error
          retention-days: 3
