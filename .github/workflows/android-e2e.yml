name: Android E2E (reminders)

# Real-device-class automation: an x86_64 API 34 emulator (KVM) runs the Patrol
# suite in apps/mobile/patrol_test, which posts real system notifications,
# taps them in the shade and checks the deep link. Video, screenshots and
# logcat are uploaded as artifacts.
on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/android-e2e.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/android-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.0
  PATROL_CLI_VERSION: 4.8.0

jobs:
  e2e:
    name: Patrol on emulator (API 34, x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Check out repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Use Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4 resolved 2026-10-25
        with:
          distribution: temurin
          java-version: 17

      - name: Install pinned Flutter SDK
        shell: bash
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "FLUTTER_ROOT=$RUNNER_TEMP/flutter" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Gradle memory for a shared runner
        run: |
          mkdir -p ~/.gradle
          echo 'org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g' > ~/.gradle/gradle.properties

      - name: Prepare Flutter and Patrol CLI
        working-directory: apps/mobile
        run: |
          flutter config --no-analytics
          flutter precache --android
          flutter pub get --enforce-lockfile
          dart pub global activate patrol_cli "$PATROL_CLI_VERSION"
          patrol --version

      - name: Build app and test APKs (before the emulator boots)
        working-directory: apps/mobile
        run: patrol build android --debug --target patrol_test/reminders_device_test.dart --verbose

      - name: Run suite on emulator
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2 resolved 2026-10-25
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 4096M
          disk-size: 6000M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: E2E_OUT=$GITHUB_WORKSPACE/e2e-evidence bash tools/scripts/android-e2e.sh

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-e2e-evidence
          path: e2e-evidence
          if-no-files-found: warn
          retention-days: 14
